name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - "package-lock.json"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Rename APK
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk BeHealthy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BeHealthy-apk
          path: BeHealthy.apk
      - name: Publish to the "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest BeHealthy.apk --target "$GITHUB_SHA" --prerelease \
            --title "BeHealthy (Android, sinov)" \
            --notes "Telefonga o'rnatish uchun sinov APK. Commit: $GITHUB_SHA"
